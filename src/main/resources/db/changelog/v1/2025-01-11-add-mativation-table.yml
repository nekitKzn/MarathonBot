databaseChangeLog:
  - changeSet:
      id: 01_add_table_motivation
      author: lobanov_nikita
      changes:
        - addColumn:
            tableName: marathon
            columns:
              - column:
                  name: motivation_sender
                  type: boolean
                  defaultValueBoolean: false
  - changeSet:
      id: 02_add_table_motivation
      author: lobanov_nikita
      changes:
        - createTable:
            tableName: motivation
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: text
                  type: varchar
              - column:
                  name: marathon_id
                  type: bigint
              - column:
                  name: is_send
                  type: boolean
                  defaultValueBoolean: false