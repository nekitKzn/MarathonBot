databaseChangeLog:
  - changeSet:
      id: delete-is-work-field
      author: lobanov_nikita
      changes:
        - dropColumn:
            tableName: marathon
            columnName: is_work
  - changeSet:
      id: add-field-marathon-id-in-goal
      author: lobanov_nikita
      changes:
        - addColumn:
            tableName: goal
            columns:
              - column:
                  name: marathon_id
                  type: bigint
                  constraints:
                    referencedTableName: marathon
                    referencedColumnNames: id
                    foreignKeyName: goal_marathon_id_fk
  - changeSet:
      id: delete-columns
      author: lobanov_nikita
      changes:
        - dropColumn:
            tableName: history
            columnName: goal_name
  - changeSet:
      id: migrate-goal-marathon-ids
      author: lobanov_nikita
      changes:
        - sql:
            sql: |
              UPDATE goal g
              SET marathon_id = u.marathon_id
              FROM users u
              WHERE g.user_id = u.telegram_id
                AND u.marathon_id IS NOT NULL;
  - changeSet:
      id: create-marathon-manager-relation
      author: lobanov_nikita
      changes:
        - createTable:
            tableName: marathon_manager
            columns:
              - column:
                  name: marathon_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: marathon_manager
            columnNames: marathon_id, user_id
            constraintName: pk_marathon_manager
        - addForeignKeyConstraint:
            baseTableName: marathon_manager
            baseColumnNames: marathon_id
            referencedTableName: marathon
            referencedColumnNames: id
            constraintName: fk_marathon_manager_marathon
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: marathon_manager
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: telegram_id
            constraintName: fk_marathon_manager_user
            onDelete: CASCADE
  - changeSet:
      id: add-weekend-settings-to-marathon
      author: lobanov_nikita
      changes:
        - addColumn:
            tableName: marathon
            columns:
              - column:
                  name: rest_on_saturday
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: rest_on_sunday
                  type: boolean
                  defaultValueBoolean: false
  - changeSet:
      id: add-evening-questions-flag-to-marathon
      author: lobanov_nikita
      changes:
        - addColumn:
            tableName: marathon
            columns:
              - column:
                  name: evening_questions_enabled
                  type: boolean
                  defaultValueBoolean: false
  - changeSet:
      id: add-asked-count-to-goal
      author: lobanov_nikita
      changes:
        - addColumn:
            tableName: goal
            columns:
              - column:
                  name: asked_count
                  type: int
                  defaultValueNumeric: 0

